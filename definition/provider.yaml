# Edit this file to add or remove components.
# Run `make generate` after making changes.

# Provider identity and component definitions.
# Edit this file to add or remove components.
# Run `make generate` after making changes.

name: provider-percona-postgresql

# Instance-wide parameters (Instance.spec.parameters), a Go type in
# definition/types.go.
parametersSchema: Parameters

components:
    engine:
        type: postgresql
        parametersSchema: PostgresqlParameters
    proxy:
        type: pgbouncer
        parametersSchema: PgbouncerParameters

# Component types: the kind of the software each type runs, published as
# Provider.spec.componentTypes.<type>.kind and matched by monitoring classes.
# Version catalogs stay in versions.yaml.
componentTypes:
    postgresql:
        kind: postgresql
    pgbouncer:
        kind: pgbouncer
