# Cluster topology definition.
# This file defines both the structural topology and its UI rendering.
#
# config.components: Which components are used and their defaults.
# config.parametersSchema: Reference a Go type for custom topology parameters fields.
# ui: Rendering hints for the frontend form.
#
# See github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md
# for detailed guidance.

config:
    parametersSchema: ClusterTopologyParameters
    components:
        engine:
            type: postgresql
            replicas: 3
        proxy:
            type: pgbouncer
            replicas: 2
        monitoring:
            optional: true
ui:
    sections:
        databaseVersion:
            components:
                version:
                    fieldParams:
                        label: Database Version
                        optionsPath: spec.versions
                        optionsPathConfig:
                            labelPath: name
                            valuePath: name
                        modes:
                            edit:
                                disabled: true
                            restore:
                                disabled: true
                    path: spec.version
                    uiType: select
                    validation:
                        required: true
            description: Provide the database version for your new database.
            label: Database Version
        resources:
            components:
                numberOfNodes:
                    fieldParams:
                        label: Number of nodes
                        defaultValue: 2
                    path: spec.components.engine.replicas
                    uiType: number
                    validation:
                        min: 1
                diskSize:
                    fieldParams:
                        label: Disk Size
                        defaultValue: 25
                        badge: Gi
                        badgeToApi: true
                    path: spec.components.engine.storage.size
                    uiType: number
                    validation:
                      min: 1
                resourcesLimits:
                    components:
                        cpu:
                            fieldParams:
                                label: CPU Limit
                                placeholder: 600m
                            path: spec.components.engine.resources.limits.cpu
                            uiType: text
                            validation:
                              regex:
                                pattern: '^([0-9]+m|[0-9]+(\.[0-9]{1,3})?)$'
                                message: "Invalid CPU value. Use a whole or decimal number of cores (e.g. 1, 0.5, 1.5) or millicpu with an m suffix (e.g. 200m, 1500m)."
                        memory:
                            fieldParams:
                                label: Memory Limit
                                placeholder: 1Gi
                            path: spec.components.engine.resources.limits.memory
                            uiType: text
                            validation:
                              regex:
                                pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei)$'
                                message: "Invalid memory value. Use a number followed by a unit: Ki, Mi, Gi, Ti, Pi, or Ei (e.g. 128Mi, 1Gi). A unit is required."
                    groupType: line
                    uiType: group
                resourcesRequests:
                    components:
                        cpu:
                            fieldParams:
                                label: CPU Request
                                placeholder: 600m
                            path: spec.components.engine.resources.requests.cpu
                            uiType: text
                            validation:
                              regex:
                                pattern: '^([0-9]+m|[0-9]+(\.[0-9]{1,3})?)$'
                                message: "Invalid CPU value. Use a whole or decimal number of cores (e.g. 1, 0.5, 1.5) or millicpu with an m suffix (e.g. 200m, 1500m)."
                        memory:
                            fieldParams:
                                label: Memory Request
                                placeholder: 1Gi
                            path: spec.components.engine.resources.requests.memory
                            uiType: text
                            validation:
                              regex:
                                pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei)$'
                                message: "Invalid memory value. Use a number followed by a unit: Ki, Mi, Gi, Ti, Pi, or Ei (e.g. 128Mi, 1Gi). A unit is required."

                    groupType: line
                    uiType: group
            description: Configure the resources your database will have access to.
            label: Resources
            componentsOrder:
              - numberOfNodes
              - diskSize
              - resourcesLimits
              - resourcesRequests
        proxy:
          label: "Proxy"
          description: "Configure a single proxy type for the cluster."
          components:
            proxyType:
              uiType: select
              path: spec.components.proxy.type
              fieldParams:
                label: "Proxy type"
                defaultValue: "pgbouncer"
                options:
                  - label: "PGBouncer"
                    value: "pgbouncer"
              validation:
                required: true
            proxyNodes:
              uiType: number
              path: spec.components.proxy.replicas
              fieldParams:
                label: "Number of proxy nodes"
                defaultValue: 2
              validation:
                min: 1
                int: true
                required: true
            proxyLimits:
              uiType: group
              groupType: line
              components:
                cpu:
                  uiType: text
                  placeholder: 600m
                  path: spec.components.proxy.resources.limits.cpu
                  fieldParams:
                    label: CPU Limit
                    defaultValue: 200m
                  validation:
                    regex:
                      pattern: '^([0-9]+m|[0-9]+(\.[0-9]{1,3})?)$'
                      message: "Invalid CPU value. Use a whole or decimal number of cores (e.g. 1, 0.5, 1.5) or millicpu with an m suffix (e.g. 200m, 1500m)."
                memory:
                  uiType: text
                  placeholder: 1Gi
                  path: spec.components.proxy.resources.limits.memory
                  fieldParams:
                    label: Memory Limit
                    defaultValue: 128Mi
                  validation:
                    regex:
                      pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei)$'
                      message: "Invalid memory value. Use a number followed by a unit: Ki, Mi, Gi, Ti, Pi, or Ei (e.g. 128Mi, 1Gi). A unit is required."
            proxyRequests:
              uiType: group
              groupType: line
              components:
                cpu:
                  placeholder: 600m
                  uiType: text
                  path: spec.components.proxy.resources.requests.cpu
                  fieldParams:
                    label: CPU Limit
                    defaultValue: 200m
                  validation:
                    regex:
                      pattern: '^([0-9]+m|[0-9]+(\.[0-9]{1,3})?)$'
                      message: "Invalid CPU value. Use a whole or decimal number of cores (e.g. 1, 0.5, 1.5) or millicpu with an m suffix (e.g. 200m, 1500m)."
                memory:
                  uiType: text
                  placeholder: 1Gi
                  path: spec.components.proxy.resources.requests.memory
                  fieldParams:
                    label: Memory Limit
                    defaultValue: 128Mi
                  validation:
                    regex:
                      pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei)$'
                      message: "Invalid memory value. Use a number followed by a unit: Ki, Mi, Gi, Ti, Pi, or Ei (e.g. 128Mi, 1Gi). A unit is required."
          componentsOrder:
            - proxyType
            - proxyNodes
            - proxyLimits
            - proxyRequests
        monitoring:
            label: Monitoring
            description: Attach a MonitoringConfig to collect metrics.
            components:
                monitoring:
                    uiType: select
                    path: spec.components.monitoring.parameters.monitoringConfigName
                    fieldParams:
                        label: Monitoring endpoint
                        displayEmpty: true
                    dataSource:
                        provider: monitoringConfigs
    sectionsOrder:
        - databaseVersion
        - resources
        - proxy
        - monitoring
