# Cluster topology definition.
# This file defines both the structural topology and its UI rendering.
#
# config.components: Which components are used and their defaults.
# config.parametersSchema: Reference a Go type for custom topology parameters fields.
# ui: Rendering hints for the frontend form.
#
# See github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md
# for detailed guidance.

config:
    parametersSchema: ClusterTopologyParameters
    components:
        engine:
            type: postgresql
            replicas: 2
        proxy:
            type: pgbouncer
            replicas: 2
ui:
    sections:
        databaseVersion:
            components:
                version:
                    fieldParams:
                        label: Database Version
                        optionsPath: spec.versions
                        optionsPathConfig:
                            labelPath: name
                            valuePath: name
                        modes:
                            edit:
                                disabled: true
                            restore:
                                disabled: true
                    path: spec.version
                    uiType: select
                    validation:
                        required: true
            description: Provide the database version for your new database.
            label: Database Version
        resources:
            components:
                numberOfNodes:
                    fieldParams:
                        label: Number of nodes
                        defaultValue: 2
                    path: spec.components.engine.replicas
                    uiType: number
                    validation:
                        min: 1
                diskSize:
                    fieldParams:
                        label: Disk Size
                        defaultValue: 25
                        badge: Gi
                        badgeToApi: true
                    path: spec.components.engine.storage.size
                    uiType: number
                    validation:
                      min: 1
                resourcesLimits:
                    components:
                        cpu:
                            fieldParams:
                                label: CPU Limit
                                placeholder: 600m
                            path: spec.components.engine.resources.limits.cpu
                            uiType: text
                            validation:
                              regex:
                                pattern: '^([0-9]+m|[0-9]+(\.[0-9]{1,3})?)$'
                                message: "Invalid CPU value. Use a whole or decimal number of cores (e.g. 1, 0.5, 1.5) or millicpu with an m suffix (e.g. 200m, 1500m)."
                        memory:
                            fieldParams:
                                label: Memory Limit
                                placeholder: 1Gi
                            path: spec.components.engine.resources.limits.memory
                            uiType: text
                            validation:
                              regex:
                                pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei)$'
                                message: "Invalid memory value. Use a number followed by a unit: Ki, Mi, Gi, Ti, Pi, or Ei (e.g. 128Mi, 1Gi). A unit is required."
                    groupType: line
                    uiType: group
                # TODO: switch to groupType: collapsible with
                # groupParams.defaultExpanded: false once the UI supports it
                # (openeverest/openeverest#1860); accordions always render expanded.
                resourcesRequests:
                    uiType: group
                    groupType: accordion
                    label: Resource requests
                    components:
                        requests:
                            uiType: group
                            groupType: line
                            components:
                                cpu:
                                    fieldParams:
                                        label: CPU Request
                                        placeholder: 600m
                                    path: spec.components.engine.resources.requests.cpu
                                    uiType: text
                                    validation:
                                      regex:
                                        pattern: '^([0-9]+m|[0-9]+(\.[0-9]{1,3})?)$'
                                        message: "Invalid CPU value. Use a whole or decimal number of cores (e.g. 1, 0.5, 1.5) or millicpu with an m suffix (e.g. 200m, 1500m)."
                                memory:
                                    fieldParams:
                                        label: Memory Request
                                        placeholder: 1Gi
                                    path: spec.components.engine.resources.requests.memory
                                    uiType: text
                                    validation:
                                      regex:
                                        pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei)$'
                                        message: "Invalid memory value. Use a number followed by a unit: Ki, Mi, Gi, Ti, Pi, or Ei (e.g. 128Mi, 1Gi). A unit is required."
                            componentsOrder:
                              - cpu
                              - memory
                    componentsOrder:
                      - requests
            description: Configure the resources your database will have access to.
            label: Resources
            componentsOrder:
              - numberOfNodes
              - diskSize
              - resourcesLimits
              - resourcesRequests
        proxy:
          label: "Proxy"
          description: "Configure a single proxy type for the cluster."
          components:
            proxyType:
              uiType: select
              path: spec.components.proxy.type
              fieldParams:
                label: "Proxy type"
                defaultValue: "pgbouncer"
                options:
                  - label: "PGBouncer"
                    value: "pgbouncer"
              validation:
                required: true
            proxyNodes:
              uiType: number
              path: spec.components.proxy.replicas
              fieldParams:
                label: "Number of proxy nodes"
                defaultValue: 2
              validation:
                min: 1
                int: true
                required: true
            proxyLimits:
              uiType: group
              groupType: line
              components:
                cpu:
                  uiType: text
                  path: spec.components.proxy.resources.limits.cpu
                  fieldParams:
                    label: CPU Limit
                    placeholder: 600m
                    defaultValue: 200m
                  validation:
                    regex:
                      pattern: '^([0-9]+m|[0-9]+(\.[0-9]{1,3})?)$'
                      message: "Invalid CPU value. Use a whole or decimal number of cores (e.g. 1, 0.5, 1.5) or millicpu with an m suffix (e.g. 200m, 1500m)."
                memory:
                  uiType: text
                  path: spec.components.proxy.resources.limits.memory
                  fieldParams:
                    label: Memory Limit
                    placeholder: 1Gi
                    defaultValue: 128Mi
                  validation:
                    regex:
                      pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei)$'
                      message: "Invalid memory value. Use a number followed by a unit: Ki, Mi, Gi, Ti, Pi, or Ei (e.g. 128Mi, 1Gi). A unit is required."
              componentsOrder:
                - cpu
                - memory
            # TODO: switch to groupType: collapsible with
            # groupParams.defaultExpanded: false once the UI supports it
            # (openeverest/openeverest#1860); accordions always render expanded.
            proxyRequests:
              uiType: group
              groupType: accordion
              label: Resource requests
              components:
                requests:
                  uiType: group
                  groupType: line
                  components:
                    cpu:
                      uiType: text
                      path: spec.components.proxy.resources.requests.cpu
                      fieldParams:
                        label: CPU Request
                        placeholder: 200m
                        defaultValue: 200m
                      validation:
                        regex:
                          pattern: '^([0-9]+m|[0-9]+(\.[0-9]{1,3})?)$'
                          message: "Invalid CPU value. Use a whole or decimal number of cores (e.g. 1, 0.5, 1.5) or millicpu with an m suffix (e.g. 200m, 1500m)."
                    memory:
                      uiType: text
                      path: spec.components.proxy.resources.requests.memory
                      fieldParams:
                        label: Memory Request
                        placeholder: 128Mi
                        defaultValue: 128Mi
                      validation:
                        regex:
                          pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei)$'
                          message: "Invalid memory value. Use a number followed by a unit: Ki, Mi, Gi, Ti, Pi, or Ei (e.g. 128Mi, 1Gi). A unit is required."
                  componentsOrder:
                    - cpu
                    - memory
              componentsOrder:
                - requests
            proxyExposure:
              uiType: select
              path: spec.components.proxy.service.serviceType
              fieldParams:
                label: "Exposure"
                helperText: "How clients reach PgBouncer. ClusterIP keeps it reachable only from inside the Kubernetes cluster."
                defaultValue: "ClusterIP"
                options:
                  - label: "ClusterIP"
                    value: "ClusterIP"
                  - label: "LoadBalancer"
                    value: "LoadBalancer"
                  - label: "NodePort"
                    value: "NodePort"
                # TODO: Support Service annotations and LoadBalancer source ranges
                # https://github.com/openeverest/openeverest/issues/1959
                # https://github.com/openeverest/openeverest/issues/2398
              validation:
                required: true
            proxyConfiguration:
              uiType: text
              path: spec.components.proxy.parameters.configuration
              fieldParams:
                label: Custom proxy configuration
                placeholder: |
                  max_client_conn: "500"
                  default_pool_size: 20
                multiline: true
                minRows: 3
                maxRows: 8
              validation:
                regex:
                  pattern: '^([ \t]*(#.*)?|[ \t]*[A-Za-z_][\w.]*[ \t]*:.*)(\r?\n([ \t]*(#.*)?|[ \t]*[A-Za-z_][\w.]*[ \t]*:.*))*[ \t\r\n]*$'
                  message: 'Each line must be a "parameter: value" pair (or a # comment), e.g. max_client_conn: "500"'
          componentsOrder:
            - proxyType
            - proxyNodes
            - proxyLimits
            - proxyRequests
            - proxyExposure
            - proxyConfiguration
        tls:
            label: "TLS"
            description: "Encrypt connections to your database and between its members."
            components:
                mode:
                    uiType: select
                    path: spec.parameters.tls.mode
                    fieldParams:
                        label: "TLS mode"
                        defaultValue: "preferTLS"
                        helperText: "pgBouncer always requires TLS from clients; this controls direct connections to PostgreSQL."
                        options:
                            - label: "Preferred: direct clients choose whether to use TLS"
                              value: "preferTLS"
                            - label: "Required: all connections must use TLS"
                              value: "requireTLS"
                    validation:
                        required: true
                certificates:
                    uiType: group
                    groupType: bordered
                    label: "Certificates"
                    description: "Leave empty to have certificates issued for the instance: by cert-manager when it is installed, otherwise by a CA created for the instance. Can't be changed after the instance is created."
                    components:
                        certificateSecretName:
                            uiType: text
                            path: spec.parameters.tls.certificateSecretName
                            fieldParams:
                                label: "Certificate secret"
                                helperText: "Secret with tls.crt, tls.key and ca.crt that clients connect to"
                                modes:
                                    edit:
                                        disabled: true
                            validation:
                                celExpressions:
                                    - celExpr: "!has(spec.parameters.tls.certificateSecretName) || spec.parameters.tls.certificateSecretName == '' || !has(spec.parameters.tls.rootCASecretName) || spec.parameters.tls.rootCASecretName == ''"
                                      message: "Use either certificate secrets or a root CA secret, not both"
                        replicationCertificateSecretName:
                            uiType: text
                            path: spec.parameters.tls.replicationCertificateSecretName
                            fieldParams:
                                label: "Replication certificate secret"
                                helperText: "For connections between members; must share the same ca.crt as the certificate secret"
                                modes:
                                    edit:
                                        disabled: true
                            validation:
                                celExpressions:
                                    - celExpr: "!has(spec.parameters.tls.replicationCertificateSecretName) || spec.parameters.tls.replicationCertificateSecretName == '' || (has(spec.parameters.tls.certificateSecretName) && spec.parameters.tls.certificateSecretName != '')"
                                      message: "Set the certificate secret as well"
                        rootCASecretName:
                            uiType: text
                            path: spec.parameters.tls.rootCASecretName
                            fieldParams:
                                label: "Root CA secret"
                                helperText: "Secret with root.crt and root.key the operator signs generated certificates with"
                                modes:
                                    edit:
                                        disabled: true
                            validation:
                                celExpressions:
                                    - celExpr: "!has(spec.parameters.tls.rootCASecretName) || spec.parameters.tls.rootCASecretName == '' || !has(spec.parameters.tls.certificateSecretName) || spec.parameters.tls.certificateSecretName == ''"
                                      message: "Use either a root CA secret or certificate secrets, not both"
                    componentsOrder:
                        - certificateSecretName
                        - replicationCertificateSecretName
                        - rootCASecretName
            componentsOrder:
                - mode
                - certificates
        advanced:
            label: Advanced Configuration
            description: Fine-tune PostgreSQL by overriding its default configuration parameters.
            components:
                configuration:
                    uiType: text
                    path: spec.components.engine.parameters.configuration
                    fieldParams:
                        label: Custom PostgreSQL configuration
                        placeholder: |
                            max_connections: "500"
                            shared_buffers: 1GB
                            wal_level: logical
                        multiline: true
                        minRows: 3
                        maxRows: 8
                    validation:
                        regex:
                            pattern: '^([ \t]*(#.*)?|[ \t]*[A-Za-z_][\w.]*[ \t]*:.*)(\r?\n([ \t]*(#.*)?|[ \t]*[A-Za-z_][\w.]*[ \t]*:.*))*[ \t\r\n]*$'
                            message: 'Each line must be a "parameter: value" pair (or a # comment), e.g. max_connections: "500"'
                pgHBA:
                    uiType: text
                    path: spec.components.engine.parameters.pgHBA
                    fieldParams:
                        label: Client access rules (pg_hba)
                        placeholder: |
                            hostssl orders orders_app 10.0.0.0/8 scram-sha-256
                            host    orders all        all        reject
                        helperText: "Optional. One pg_hba.conf record per line, checked in order before the default rule that admits every user over TLS with a password; end with a reject record to allow only what is listed. Methods: scram-sha-256, md5, cert, ldap, radius, reject."
                        multiline: true
                        minRows: 3
                        maxRows: 10
                    validation:
                        regex:
                            pattern: '^([ \t]*(#.*)?|[ \t]*(host|hostssl|hostnossl)[ \t]+\S.*)(\r?\n([ \t]*(#.*)?|[ \t]*(host|hostssl|hostnossl)[ \t]+\S.*))*[ \t\r\n]*$'
                            message: 'Each line must be a host, hostssl or hostnossl record (or a # comment), e.g. hostssl orders orders_app 10.0.0.0/8 scram-sha-256'
                podSchedulingPolicy:
                  uiType: group
                  groupType: bordered
                  label: "Pod scheduling policy"
                  description: "Control how database pods are scheduled onto nodes using affinity rules."
                  components:
                    policy:
                      uiType: widget
                      widgetType: podSchedulingPolicy
                  componentsOrder:
                    - policy
            componentsOrder:
              - configuration
              - pgHBA
              - podSchedulingPolicy
    sectionsOrder:
        - databaseVersion
        - resources
        - proxy
        - tls
        - advanced
