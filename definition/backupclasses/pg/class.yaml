# Pg BackupClass definition.
# This file is the source of truth for the generated BackupClass manifest.
#
# provider-sdk generate makes the class ProviderManaged and names this
# provider in providerManaged.providerRef: the provider claims and executes it.
#
# Fields:
#   displayName/description: human-readable metadata.
#   backupStorageClasses: the BackupStorageClasses this class can write to,
#     each with the authentication modes it supports, the parameters it
#     supports (parametersSchema narrows the storage class's schema) and the
#     spec.tls settings it honours (tls). Required.
#   providerManaged.supportsPITR: advertise PITR capability to Restore validation.
#   providerManaged.limits: caps the runtime enforces against Instance.spec.backup.
#     maxStorages, maxPITREnabledStorages, maxSchedulesPerStorage — unset means unlimited.
#   providerManaged.pitrConfigSchema: Go type name (in this package) describing
#     per-storage PITR custom config. Resolved to an OpenAPI schema at generation time.
#   config.openAPIV3Schema / restoreConfig.openAPIV3Schema: Go type names
#     describing backup-time and restore-time custom config respectively.
#
# Co-located files:
#   ui.yaml  — free-form UI rendering hints, inlined verbatim under spec.uiSchema.
#   types.go — Go types referenced above; OpenAPI-extracted by provider-sdk generate.

parametersSchema:
    openAPIV3Schema: PgBackupConfig
backupStorageClasses:
    - name: s3
      authModes:
        - AccessKey
      parametersSchema:
        openAPIV3Schema:
          properties:
            # pgBackRest cannot use GCS through its S3 API.
            implementation:
              enum: [aws, minio, ceph, other]
            # pgBackRest has no plain-HTTP S3 mode.
            endpointURL:
              pattern: "^https://"
      tls:
        # repoN-storage-ca-file and repoN-storage-verify-tls=n in pgBackRest.
        customCA: Supported
        insecureSkipVerify: Supported
description: |
  BackupClass for PostgreSQL based on Percona Operator for PostgreSQL. Backups are managed
  by pgBackRest via the Percona PG operator; OpenEverest does not run any side-car Job for this class.
  Supports full, diff, and incr backup types.
displayName: "Percona Backup for PostgreSQL"
providerManaged:
    limits:
      maxStorages: 4
    pitrParametersSchema:
      openAPIV3Schema: PgPITRConfig
    supportsPITR: true
restoreParametersSchema:
    openAPIV3Schema: PgRestoreConfig
