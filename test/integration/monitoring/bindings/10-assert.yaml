# Core materialises one binding per entry; the pmm one resolves to
# ProviderManaged and the provider reports it Configured, flagged because
# pmm-client does not verify the PMM server certificate.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringBinding
metadata:
  labels:
    core.openeverest.io/instance: pg-bindings
    monitoring.openeverest.io/entry: pmm
  ownerReferences:
    - apiVersion: core.openeverest.io/v1alpha1
      kind: Instance
      name: pg-bindings
spec:
  instanceRef:
    name: pg-bindings
  destinationRef:
    name: pmm-it
  classRef:
    name: pmm-it
  executionMode: ProviderManaged
  parameters:
    resources:
      limits:
        memory: 400Mi
status:
  (conditions[?type == 'Accepted'].status | [0]): "True"
  (conditions[?type == 'Configured'].status | [0]): "True"
  (conditions[?type == 'Configured'].reason | [0]): AgentTLSNotVerified
---
# The prometheus entry resolves to ExtensionManaged because postgresql and
# pgbouncer declare metrics: Exporter; its Configured condition belongs to the
# class controller, which is not running here.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringBinding
metadata:
  labels:
    core.openeverest.io/instance: pg-bindings
    monitoring.openeverest.io/entry: prometheus
spec:
  destinationRef:
    name: prometheus-it
  classRef:
    name: prometheus-it
  executionMode: ExtensionManaged
status:
  (conditions[?type == 'Accepted'].status | [0]): "True"
---
# spec.pmm comes from the binding: server from the destination URL, image from
# the class, limits from the entry parameters. The exporters run because the
# prometheus class requires metrics, and log in as the monitor user PgBouncer
# lets read its stats.
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: pg-bindings
spec:
  instances:
    - name: instance1
      sidecars:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          ports:
            - name: metrics
              containerPort: 9187
  proxy:
    pgBouncer:
      sidecars:
        - name: pgbouncer-exporter
          image: quay.io/prometheuscommunity/pgbouncer-exporter:v0.12.1
          ports:
            - name: metrics
              containerPort: 9127
      config:
        global:
          stats_users: everest-monitor
          auth_dbname: postgres
  users:
    - name: postgres
    - name: everest-monitor
      options: SUPERUSER
  pmm:
    enabled: true
    serverHost: pmm-it.example.com
    image: percona/pmm-client:3.8.0
    secret: pg-bindings-pmm-secret
    customClusterName: pg-bindings
    imagePullPolicy: IfNotPresent
    postgresParams: (join('', ['--custom-labels=namespace=', $namespace, ',core_openeverest_io_instance=pg-bindings']))
    resources:
      limits:
        memory: 400Mi
---
# The destination token, mirrored where the operator reads it and owned by the
# Instance.
apiVersion: v1
kind: Secret
metadata:
  name: pg-bindings-pmm-secret
  ownerReferences:
    - apiVersion: core.openeverest.io/v1alpha1
      kind: Instance
      name: pg-bindings
      controller: true
type: Opaque
data:
  PMM_SERVER_TOKEN: YWJjZGVm
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: pg-bindings
status:
  monitoring:
    (destinations[?name == 'pmm'] | [0]):
      mode: ProviderManaged
      configured: "True"
      reason: AgentTLSNotVerified
    (destinations[?name == 'prometheus'] | [0]):
      mode: ExtensionManaged
