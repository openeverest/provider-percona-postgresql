---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: monitoring-bindings
spec:
  description: |
    Monitoring through Instance.spec.monitoring.destinations[]: core
    materialises one binding per entry. A ProviderManaged pmm binding renders
    PerconaPGCluster.spec.pmm and mirrors the destination token; a pmm
    destination that rejects its token leaves the pmm entry Configured but not
    Ready. An ExtensionManaged prometheus binding turns on the
    postgres_exporter and pgbouncer_exporter sidecars with their monitor
    login, and the provider publishes their endpoints once the components
    serve. Replacing prometheus with victoriametrics keeps the exporters and
    endpoints, and dropping it removes them while PMM stays. Core refuses
    deleting the pmm destination while the Instance lists it; if it
    disappears anyway the live spec.pmm is kept, and dropping the pmm entry
    disables PMM and deletes the token copy. No extension controller runs
    here, so the classes are claimed by hand and the ExtensionManaged
    bindings are never Configured; the Percona operator is scaled to 0, so
    readiness is patched into the cluster status.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,perconapgclusters.pgv2.percona.com,monitoringdestination,monitoringbinding,secret -o yaml
    - script:
        content: kubectl get monitoringclass -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-postgresql
        tail: 100
    - script:
        content: |
          for kind in perconapgclusters.pgv2.percona.com instance; do
            kubectl -n "$NAMESPACE" get "$kind" -o name 2>/dev/null | while read obj; do
              kubectl -n "$NAMESPACE" patch "$obj" --type=merge -p '{"metadata":{"finalizers":[]}}' || true
            done
          done
  steps:
    - name: setup
      try:
        - script:
            content: |
              kubectl -n provider-system scale deployment/provider-percona-postgresql-pg-operator --replicas=0
              kubectl -n provider-system wait --for=jsonpath='{.spec.replicas}'=0 deployment/provider-percona-postgresql-pg-operator --timeout=60s
        - apply:
            file: 00-install.yaml
        # Stand in for the extension controllers: a class is usable only once
        # its controller has claimed it at its current generation.
        - script:
            content: |
              for class in pmm-it prometheus-it victoriametrics-it; do
                gen=$(kubectl get monitoringclass/$class -o jsonpath='{.metadata.generation}')
                kubectl patch monitoringclass/$class --subresource status --type merge \
                  -p '{"status":{"conditions":[{"type":"Accepted","status":"True","reason":"Accepted","message":"claimed by the test","observedGeneration":'"$gen"',"lastTransitionTime":"2026-01-01T00:00:00Z"}]}}'
              done
        - assert:
            file: 00-assert.yaml

    - name: create-cluster-with-destinations
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml

    # Stand in for the pmm extension's probe: the server rejects the token.
    - name: pmm-destination-rejects-the-token
      try:
        - script:
            content: |
              set -e
              gen=$(kubectl get monitoringdestination/pmm-it -n $NAMESPACE -o jsonpath='{.metadata.generation}')
              patch=$(kubectl get monitoringdestination/pmm-it -n $NAMESPACE -o json | jq -c --argjson gen "$gen" \
                '{status: {conditions: ([.status.conditions[]? | select(.type != "Ready")] + [{type: "Ready", status: "False", reason: "Unauthorized", message: "probed by the test", observedGeneration: $gen, lastTransitionTime: "2026-01-01T00:00:00Z"}])}}')
              kubectl patch monitoringdestination/pmm-it -n $NAMESPACE --subresource status --type merge -p "$patch"
        - assert:
            file: 11-pmm-unauthorized-assert.yaml

    # The token is replaced and the probe succeeds.
    - name: pmm-destination-accepts-the-token
      try:
        - script:
            content: |
              set -e
              gen=$(kubectl get monitoringdestination/pmm-it -n $NAMESPACE -o jsonpath='{.metadata.generation}')
              patch=$(kubectl get monitoringdestination/pmm-it -n $NAMESPACE -o json | jq -c --argjson gen "$gen" \
                '{status: {conditions: ([.status.conditions[]? | select(.type != "Ready")] + [{type: "Ready", status: "True", reason: "Ready", message: "probed by the test", observedGeneration: $gen, lastTransitionTime: "2026-01-01T00:00:00Z"}])}}')
              kubectl patch monitoringdestination/pmm-it -n $NAMESPACE --subresource status --type merge -p "$patch"
        - assert:
            file: 11-pmm-ready-assert.yaml

    # Simulate the Percona operator (scaled to 0) reporting ready pods: the
    # provider publishes a component's metrics endpoint once it has one.
    - name: cluster-ready
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE patch perconapgclusters.pgv2.percona.com/pg-bindings --subresource status --type merge \
                -p '{"status":{"state":"ready","postgres":{"size":3,"ready":3},"pgbouncer":{"size":1,"ready":1}}}'
        - assert:
            file: 11-assert.yaml

    - name: switch-prometheus-to-victoriametrics
      try:
        - apply:
            file: 12-switch-to-victoriametrics.yaml
        - assert:
            file: 12-assert.yaml
        - error:
            file: 12-errors.yaml

    - name: drop-victoriametrics-entry
      try:
        - apply:
            file: 14-drop-victoriametrics.yaml
        - assert:
            file: 14-assert.yaml
        - error:
            file: 14-errors.yaml

    # Core refuses deleting a destination an Instance lists. Force it through
    # (a deletion admitted on a stale count, then the in-use finalizer
    # removed) to cover a destination that disappears anyway.
    - name: delete-destination
      try:
        - assert:
            resource:
              apiVersion: monitoring.openeverest.io/v1alpha1
              kind: MonitoringDestination
              metadata:
                name: pmm-it
              status:
                attachedInstances: 1
        - script:
            content: kubectl -n $NAMESPACE delete monitoringdestination/pmm-it --wait=false
            check:
              ($error != null): true
              (contains($stderr, 'in use by 1 database')): true
        - script:
            content: |
              set -e
              kubectl -n $NAMESPACE patch monitoringdestination/pmm-it --subresource=status --type=merge -p '{"status":{"attachedInstances":0}}'
              kubectl -n $NAMESPACE delete monitoringdestination/pmm-it --wait=false
              kubectl -n $NAMESPACE patch monitoringdestination/pmm-it --type=merge -p '{"metadata":{"finalizers":null}}'
        - error:
            resource:
              apiVersion: monitoring.openeverest.io/v1alpha1
              kind: MonitoringDestination
              metadata:
                name: pmm-it
        - assert:
            file: 20-assert.yaml

    - name: drop-pmm-entry
      try:
        - apply:
            file: 30-drop-pmm.yaml
        - assert:
            file: 30-assert.yaml
        - error:
            file: 30-errors.yaml

    - name: delete-cluster
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete instance/pg-bindings perconapgclusters.pgv2.percona.com/pg-bindings --wait=false --ignore-not-found && sleep 5
              kubectl -n $NAMESPACE patch perconapgclusters.pgv2.percona.com/pg-bindings -p '{"metadata":{"finalizers":null}}' --type merge || true
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: pg-bindings
            for:
              deletion: {}
        - wait:
            apiVersion: pgv2.percona.com/v2
            kind: PerconaPGCluster
            name: pg-bindings
            for:
              deletion: {}
