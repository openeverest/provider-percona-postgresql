---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: monitoring-bindings
spec:
  description: |
    PMM through Instance.spec.monitoring.destinations[]: core materialises a
    ProviderManaged binding for the pmm entry and refuses deleting the
    destination while the Instance lists it; the provider renders
    PerconaPGCluster.spec.pmm from the binding and mirrors the destination
    token, keeps that rendering if the destination disappears anyway, and
    disables PMM and deletes the token copy once the entry is dropped. The
    monitoring-pmm controller is not installed, so the class is claimed by
    hand; the Percona operator is scaled to 0.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,perconapgclusters.pgv2.percona.com,monitoringdestination,monitoringbinding,secret -o yaml
    - script:
        content: kubectl get monitoringclass -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-postgresql
        tail: 100
    - script:
        content: |
          for kind in perconapgclusters.pgv2.percona.com instance; do
            kubectl -n "$NAMESPACE" get "$kind" -o name 2>/dev/null | while read obj; do
              kubectl -n "$NAMESPACE" patch "$obj" --type=merge -p '{"metadata":{"finalizers":[]}}' || true
            done
          done
  steps:
    - name: setup
      try:
        - script:
            content: |
              kubectl -n provider-system scale deployment/provider-percona-postgresql-pg-operator --replicas=0
              kubectl -n provider-system wait --for=jsonpath='{.spec.replicas}'=0 deployment/provider-percona-postgresql-pg-operator --timeout=60s
        - apply:
            file: 00-install.yaml
        # Stand in for the monitoring-pmm controller: a class is usable only
        # once its controller has claimed it.
        - script:
            content: |
              kubectl patch monitoringclass/pmm-it --subresource status --type merge \
                -p '{"status":{"conditions":[{"type":"Accepted","status":"True","reason":"Accepted","message":"claimed by the test","lastTransitionTime":"2026-01-01T00:00:00Z"}]}}'
        - assert:
            file: 00-assert.yaml

    - name: create-cluster-with-pmm
      try:
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml

    # Core refuses deleting a destination an Instance lists. Force it through
    # (a deletion admitted on a stale count, then the in-use finalizer
    # removed) to cover a destination that disappears anyway.
    - name: delete-destination
      try:
        - assert:
            resource:
              apiVersion: monitoring.openeverest.io/v1alpha1
              kind: MonitoringDestination
              metadata:
                name: pmm-it
              status:
                attachedInstances: 1
        - script:
            content: kubectl -n $NAMESPACE delete monitoringdestination/pmm-it --wait=false
            check:
              ($error != null): true
              (contains($stderr, 'in use by 1 database')): true
        - script:
            content: |
              set -e
              kubectl -n $NAMESPACE patch monitoringdestination/pmm-it --subresource=status --type=merge -p '{"status":{"attachedInstances":0}}'
              kubectl -n $NAMESPACE delete monitoringdestination/pmm-it --wait=false
              kubectl -n $NAMESPACE patch monitoringdestination/pmm-it --type=merge -p '{"metadata":{"finalizers":null}}'
        - error:
            resource:
              apiVersion: monitoring.openeverest.io/v1alpha1
              kind: MonitoringDestination
              metadata:
                name: pmm-it
        - assert:
            file: 20-assert.yaml

    - name: drop-pmm-entry
      try:
        - apply:
            file: 30-drop-pmm.yaml
        - assert:
            file: 30-assert.yaml
        - error:
            file: 30-errors.yaml

    - name: delete-cluster
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete instance/pg-bindings perconapgclusters.pgv2.percona.com/pg-bindings --wait=false --ignore-not-found && sleep 5
              kubectl -n $NAMESPACE patch perconapgclusters.pgv2.percona.com/pg-bindings -p '{"metadata":{"finalizers":null}}' --type merge || true
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: pg-bindings
            for:
              deletion: {}
        - wait:
            apiVersion: pgv2.percona.com/v2
            kind: PerconaPGCluster
            name: pg-bindings
            for:
              deletion: {}
