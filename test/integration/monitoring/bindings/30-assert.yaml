# With the entry gone, PMM is disabled and the Instance reports no
# destinations. The runtime keeps publishing the source identity, but no
# metrics endpoints.
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: pg-bindings
spec:
  (pmm == null): true
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: pg-bindings
spec:
  (monitoring == null): true
status:
  (monitoring == null || monitoring.destinations == null): true
  (monitoring.sources.metrics == null): true
  (length(conditions[?type == 'MonitoringConfigured'])): 0
