apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pg-cluster
spec:
  providerRef:
    name: provider-percona-postgresql
  components:
    engine:
      type: postgresql
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
        storageClass: standard
    proxy:
      type: pgbouncer
      replicas: 1
    monitoring:
      type: pmm
      resources:
        requests:
          memory: 335Mi
          cpu: 335m
      parameters:
        monitoringConfigName: test-pmm
