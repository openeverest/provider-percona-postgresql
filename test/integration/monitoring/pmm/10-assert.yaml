apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pg-cluster
spec:
  providerRef:
    name: provider-percona-postgresql
  components:
    engine:
      type: postgresql
      replicas: 3
    proxy:
      type: pgbouncer
      replicas: 1
    monitoring:
      type: pmm
      parameters:
        monitoringConfigName: test-pmm
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: test-pg-cluster
spec:
  instances:
    - replicas: 3
  proxy:
    pgBouncer:
      replicas: 1
  pmm:
    enabled: true
    serverHost: pmm.example.invalid
    image: percona/pmm-client:3.7.1
    secret: test-pg-cluster-pmm-secret
    customClusterName: test-pg-cluster
    imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Secret
metadata:
  name: test-pg-cluster-pmm-secret
type: Opaque
data:
  PMM_SERVER_TOKEN: YWJjZGVm
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringConfig
metadata:
  name: test-pmm
spec:
  type: pmm
  pmm:
    url: http://pmm.example.invalid
