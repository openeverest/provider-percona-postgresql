# Expected outcome of the create-instance-with-monitoring step.
#
# Assert the Instance is accepted and the PerconaPGCluster has PMM
# configured correctly. Also assert the PMM credentials secret is
# created with the expected token key.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-monitoring-instance
spec:
  providerRef:
    name: provider-percona-postgresql
---
# Assert the PerconaPGCluster has PMM enabled with the correct server host.
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: test-monitoring-instance
spec:
  pmm:
    enabled: true
    serverHost: pmm-server.monitoring:443
    secret: test-monitoring-instance-pmm-secret
---
# Assert the PMM credentials secret was created.
apiVersion: v1
kind: Secret
metadata:
  name: test-monitoring-instance-pmm-secret

