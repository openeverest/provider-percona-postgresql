---
# Core lifecycle suite — tests the full Instance lifecycle:
# create, simulate operator readiness, and delete.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core
spec:
  description: |
    Lifecycle of an Instance: create, simulate operator readiness, update,
    and delete.

  # Collect diagnostics when a step fails.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance -o yaml
    - script:
        content: kubectl -n $NAMESPACE get perconapgcluster -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-postgresql
        tail: 100

  steps:
    - name: provider-deployed
      try:
        - assert:
            file: 00-assert.yaml

    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            file: 10-assert.yaml

    - name: instance-ready
      try:
        - script:
            content: |
              kubectl patch perconapgcluster/test-instance --subresource status -n $NAMESPACE \
                -p '{"status":{"state":"ready","postgres":{"ready":1,"size":1},"pgbouncer":{"ready":1,"size":1},"observedGeneration":1}}' --type=merge
        - assert:
            file: 11-assert.yaml

    - name: delete-instance
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete instance/test-instance --wait=false
              kubectl -n $NAMESPACE patch perconapgcluster/test-instance \
                -p '{"metadata":{"finalizers":null}}' --type merge
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-instance
            for:
              deletion: {}
