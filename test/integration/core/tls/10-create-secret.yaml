---
# User-supplied certificate secrets for spec.parameters.tls. Their content is
# not a real certificate: the PG operator is scaled to 0 in this suite, so
# nothing ever parses it as X.509 — the provider only checks that the
# required keys are non-empty and that the certificate and replication
# secrets share the same ca.crt (see validateCertificateSecret in
# internal/provider/tls.go).
apiVersion: v1
kind: Secret
metadata:
  name: test-pg-tls-certs
stringData:
  tls.crt: fake-tls-crt
  tls.key: fake-tls-key
  ca.crt: fake-ca-crt
---
apiVersion: v1
kind: Secret
metadata:
  name: test-pg-tls-repl
stringData:
  tls.crt: fake-repl-tls-crt
  tls.key: fake-repl-tls-key
  ca.crt: fake-ca-crt

