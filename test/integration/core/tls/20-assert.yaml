apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pg-tls
status:
  # Rejecting a change to an already-Ready Instance does not move its phase
  # (provider-runtime's block() only sets phase on a brand-new Instance,
  # i.e. when it is still empty); the Ready condition is what flips.
  phase: Ready
  (conditions[?type == 'Ready'] | [0].status): "False"
  (conditions[?type == 'Ready'] | [0].reason): InvalidReference
---
# The operator CR must keep the original certificate secrets: the provider
# must not apply the rejected change.
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: test-pg-tls
spec:
  secrets:
    customTLSSecret:
      name: test-pg-tls-certs
    customReplicationTLSSecret:
      name: test-pg-tls-repl

