apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pg-tls
spec:
  parameters:
    tls:
      mode: requireTLS
      certificateSecretName: test-pg-tls-certs
      replicationCertificateSecretName: test-pg-tls-repl
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: test-pg-tls
spec:
  tlsOnly: true
  secrets:
    customTLSSecret:
      name: test-pg-tls-certs
    customReplicationTLSSecret:
      name: test-pg-tls-repl
  proxy:
    pgBouncer:
      customTLSSecret:
        name: test-pg-tls-certs

