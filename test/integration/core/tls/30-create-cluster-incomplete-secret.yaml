---
# Missing ca.crt: validateCertificateSecret in internal/provider/tls.go must
# reject this before Sync ever creates a PerconaPGCluster CR.
apiVersion: v1
kind: Secret
metadata:
  name: test-pg-tls-incomplete-certs
stringData:
  tls.crt: fake-tls-crt
  tls.key: fake-tls-key
---
apiVersion: v1
kind: Secret
metadata:
  name: test-pg-tls-incomplete-repl
stringData:
  tls.crt: fake-repl-tls-crt
  tls.key: fake-repl-tls-key
  ca.crt: fake-ca-crt
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pg-tls-badsecret
spec:
  providerRef:
    name: provider-percona-postgresql
  components:
    engine:
      type: postgresql
      replicas: 3
      storage:
        size: 25Gi
    proxy:
      type: pgbouncer
      replicas: 1
  parameters:
    tls:
      certificateSecretName: test-pg-tls-incomplete-certs
      replicationCertificateSecretName: test-pg-tls-incomplete-repl

