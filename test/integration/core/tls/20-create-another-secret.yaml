---
# A second, equally valid pair of certificate secrets (sharing their own CA).
# Switching to them on the existing Ready instance must be rejected: see
# validateTLSChange in internal/provider/tls.go.
apiVersion: v1
kind: Secret
metadata:
  name: test-pg-tls-certs-2
stringData:
  tls.crt: fake-tls-crt-2
  tls.key: fake-tls-key-2
  ca.crt: fake-ca-crt-2
---
apiVersion: v1
kind: Secret
metadata:
  name: test-pg-tls-repl-2
stringData:
  tls.crt: fake-repl-tls-crt-2
  tls.key: fake-repl-tls-key-2
  ca.crt: fake-ca-crt-2

