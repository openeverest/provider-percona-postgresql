---
# Create the credentials secret so the Instance can reach Ready.
apiVersion: v1
kind: Secret
metadata:
  name: test-pg-tls-pguser-test-pg-tls
type: Opaque
stringData:
  user: test-user
  password: test-password
  pgbouncer-uri: postgresql://test-user:test-password@test-pg-tls-pgbouncer.default.svc.cluster.local/postgres?sslmode=require
  pgbouncer-host: test-pg-tls-pgbouncer.default.svc.cluster.local

