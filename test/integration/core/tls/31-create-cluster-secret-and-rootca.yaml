apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pg-tls-bothset
spec:
  providerRef:
    name: provider-percona-postgresql
  components:
    engine:
      type: postgresql
      replicas: 3
      storage:
        size: 25Gi
    proxy:
      type: pgbouncer
      replicas: 1
  parameters:
    tls:
      # Setting certificate secrets and a root CA secret together must be
      # rejected (validateTLS in internal/provider/tls.go). The certificate
      # secrets themselves are valid and already exist (created in
      # 10-create-secret.yaml), so this exercises the "both set" rule
      # specifically rather than a missing-secret error.
      certificateSecretName: test-pg-tls-certs
      replicationCertificateSecretName: test-pg-tls-repl
      rootCASecretName: test-pg-tls-rootca

