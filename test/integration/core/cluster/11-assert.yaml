apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pg-cluster
spec:
  providerRef:
    name: provider-percona-postgresql
  components:
    engine:
      type: postgresql
      replicas: 3
    proxy:
      type: pgbouncer
      replicas: 1
status:
  phase: Ready
  # The PG operator is scaled to 0, so the components have no pods.
  components:
    - name: engine
      selector: core.openeverest.io/component=engine,core.openeverest.io/instance=test-pg-cluster
      replicas: 0
      readyReplicas: 0
    - name: proxy
      selector: core.openeverest.io/component=proxy,core.openeverest.io/instance=test-pg-cluster
      replicas: 0
      readyReplicas: 0
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: test-pg-cluster
status:
  postgres:
    size: 3
    ready: 3
---
apiVersion: v1
kind: Secret
metadata:
  name: test-pg-cluster-conn
