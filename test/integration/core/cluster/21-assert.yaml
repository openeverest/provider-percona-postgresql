apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pg-cluster
spec:
  providerRef:
    name: provider-percona-postgresql
  components:
    engine:
      type: postgresql
      replicas: 5
      schedulingPolicy:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
    proxy:
      type: pgbouncer
      replicas: 1
status:
  phase: Ready
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: test-pg-cluster
spec:
  instances:
    - replicas: 5
status:
  postgres:
    size: 5
    ready: 5
