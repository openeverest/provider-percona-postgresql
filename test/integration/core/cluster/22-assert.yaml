apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pg-cluster
spec:
  providerRef:
    name: provider-percona-postgresql
  components:
    engine:
      type: postgresql
      replicas: 5
      service:
        serviceType: LoadBalancer
        annotations:
          test-annotation: "test-value"
        loadBalancerService:
          sourceRanges:
            - "10.0.0.0/8"
            - "192.168.1.100"
    proxy:
      type: pgbouncer
      replicas: 1
status:
  phase: Ready
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: test-pg-cluster
spec:
  instances:
    - replicas: 5
status:
  postgres:
    size: 5
    ready: 5
