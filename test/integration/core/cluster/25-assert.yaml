apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pg-cluster
spec:
  providerRef:
    name: provider-percona-postgresql
  components:
    engine:
      type: postgresql
      replicas: 5
      service:
        serviceType: NodePort
    proxy:
      type: pgbouncer
      replicas: 1
      parameters:
        configuration: |
          max_client_conn: "500"
          default_pool_size: 20
status:
  phase: Ready
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: test-pg-cluster
spec:
  instances:
    - replicas: 5
  proxy:
    pgBouncer:
      config:
        global:
          default_pool_size: "20"
          max_client_conn: "500"
      expose:
        type: NodePort
status:
  postgres:
    size: 5
    ready: 5

