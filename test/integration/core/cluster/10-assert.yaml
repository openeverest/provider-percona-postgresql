apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-pg-cluster
spec:
  providerRef:
    name: provider-percona-postgresql
  components:
    engine:
      type: postgresql
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
        storageClass: standard
    proxy:
      type: pgbouncer
      replicas: 1
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: test-pg-cluster
spec:
  instances:
    - replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      dataVolumeClaimSpec:
        storageClassName: standard
        resources:
          requests:
            storage: 25Gi
      metadata:
        labels:
          core.openeverest.io/component: engine
          core.openeverest.io/instance: test-pg-cluster
          core.openeverest.io/provider: provider-percona-postgresql
  proxy:
    pgBouncer:
      replicas: 1
      metadata:
        labels:
          core.openeverest.io/component: proxy
          core.openeverest.io/instance: test-pg-cluster
          core.openeverest.io/provider: provider-percona-postgresql

