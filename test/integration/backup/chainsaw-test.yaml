---
# Backup & Restore lifecycle suite — tests backup create, completion,
# restore from backup, restore completion, and clean up.
# Requires a live PG operator (deployed by the Helm chart).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: backup
spec:
  description: |
    Lifecycle of a Backup and Restore: create an Instance with backup storage,
    wait for the cluster to become ready, trigger a full backup,
    wait for completion, restore from that backup, wait for the restore
    to succeed, verify status, and clean up.

  # Increase timeouts for steps that wait on the real operator.
  timeouts:
    assert: 600s
    exec: 60s
    cleanup: 120s
    delete: 120s

  # Collect diagnostics when a step fails.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,backup,restore,backupstorage -o yaml
    - script:
        content: kubectl -n $NAMESPACE get perconapgcluster,perconapgbackup,perconapgrestore -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-percona-postgresql
        tail: 100

  steps:
    - name: provider-deployed
      try:
        - assert:
            file: 00-assert.yaml

    - name: create-backup-storage
      try:
        - apply:
            file: 10-backup-storage.yaml

    - name: create-instance
      try:
        - apply:
            file: 20-create-instance.yaml
        - assert:
            file: 20-assert.yaml

    - name: instance-ready
      try:
        # Wait for the Instance to become Ready (the real operator will
        # initialize the cluster, create stanzas, etc.).
        - assert:
            file: 21-assert.yaml

    - name: create-backup
      try:
        - apply:
            file: 30-create-backup.yaml
        - assert:
            file: 30-assert.yaml

    - name: backup-succeeded
      try:
        # Wait for the backup to complete (the real operator runs it).
        - assert:
            file: 31-assert.yaml

    - name: create-restore
      try:
        - apply:
            file: 40-create-restore.yaml
        - assert:
            file: 40-assert.yaml

    - name: restore-succeeded
      try:
        # Wait for the restore to complete (the real operator runs it).
        - assert:
            file: 41-assert.yaml

    - name: delete-restore
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete restore/test-restore-from-backup --wait=false
              # Clear finalizers on PerconaPGRestore if the operator hasn't
              # processed the deletion yet.
              kubectl -n $NAMESPACE patch perconapgrestore/test-restore-from-backup \
                -p '{"metadata":{"finalizers":null}}' --type merge 2>/dev/null || true
        - wait:
            apiVersion: backup.openeverest.io/v1alpha1
            kind: Restore
            name: test-restore-from-backup
            for:
              deletion: {}

    - name: delete-backup
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete backup/test-full-backup --wait=false
              # Clear finalizers on PerconaPGBackup if the operator hasn't
              # processed the deletion yet.
              kubectl -n $NAMESPACE patch perconapgbackup/test-full-backup \
                -p '{"metadata":{"finalizers":null}}' --type merge 2>/dev/null || true
        - wait:
            apiVersion: backup.openeverest.io/v1alpha1
            kind: Backup
            name: test-full-backup
            for:
              deletion: {}

    - name: cleanup-instance
      try:
        - script:
            timeout: 120s
            content: |
              kubectl -n $NAMESPACE delete instance/test-backup-instance --wait=false
              kubectl -n $NAMESPACE patch perconapgcluster/test-backup-instance \
                -p '{"metadata":{"finalizers":null}}' --type merge 2>/dev/null || true
              # Clean up operator-managed resources that block namespace deletion.
              kubectl -n $NAMESPACE delete sts,deploy,rs,pods,pvc,svc,secrets,configmaps --all --wait=false 2>/dev/null || true
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-backup-instance
            for:
              deletion: {}



