---
# Create the credentials secret so the Instance can reach Ready.
apiVersion: v1
kind: Secret
metadata:
  name: src-pg-cluster-pguser-src-pg-cluster
type: Opaque
stringData:
  user: test-user
  password: test-password
  pgbouncer-uri: postgresql://test-user:test-password@src-pg-cluster-pgbouncer.default.svc.cluster.local/postgres?sslmode=require
  pgbouncer-host: src-pg-cluster-pgbouncer.default.svc.cluster.local
