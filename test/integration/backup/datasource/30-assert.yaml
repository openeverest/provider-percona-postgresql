apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: dest-pg-cluster
spec:
  providerRef:
    name: provider-percona-postgresql
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: src-backup
  backup:
    enabled: true
    classRef:
      name: pg
    storages:
    - storageRef:
        name: test-storage-s3
      schedules:
      - name: full
        enabled: true
        cron: "0 2 * * *"
  components:
    engine:
      type: postgresql
      replicas: 3
      resources:
        limits:
          cpu: "1"
          memory: 4G
        requests:
          cpu: 500m
          memory: 2G
      storage:
        size: 25Gi
        storageClass: standard
    proxy:
      type: pgbouncer
      replicas: 1
status:
  phase: Restoring
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: dest-pg-cluster
spec:
  backups:
    enabled: true
    pgbackrest:
      repos:
        - name: repo1
          s3:
            bucket: test-backup-bucket
            region: us-east-1
            endpoint: http://fake
---
apiVersion: v1
kind: Secret
metadata:
  name: dest-pg-cluster-pgbackrest-repo1-creds
---
apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: dest-pg-cluster-datasource
spec:
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: src-backup
  instanceRef:
    name: dest-pg-cluster
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGRestore
metadata:
  name: dest-pg-cluster-datasource
spec:
  pgCluster: dest-pg-cluster
  repoName: repo1
  options:
    - --set=20260902-src-backup-set
    - --type=immediate
