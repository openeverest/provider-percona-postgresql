apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: src-restore
spec:
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: src-backup
  instanceRef:
    name: src-pg-cluster
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGRestore
metadata:
  name: src-restore
spec:
  pgCluster: src-pg-cluster
  repoName: repo1
  options:
    - --set=20260902-src-backup-set
    - --type=immediate
