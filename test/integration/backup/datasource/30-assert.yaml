apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: src-restore
spec:
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: src-backup
  instanceRef:
    name: src-pg-cluster
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGRestore
metadata:
  name: src-restore
spec:
  pgCluster: src-pg-cluster
  repoName: repo1
  options:
    - --set=20260902-src-backup-set
    - --type=immediate
---
# The restore replaces the data: the Instance is not Ready and clients cannot
# connect until the Restore ends.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: src-pg-cluster
status:
  phase: Provisioned
  (conditions[?type == 'Restoring'] | [0].status): "True"
  (conditions[?type == 'Ready'] | [0].status): "False"
  (conditions[?type == 'Ready'] | [0].reason): Restoring
  (conditions[?type == 'Available'] | [0].status): "False"
