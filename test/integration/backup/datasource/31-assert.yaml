apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: src-pg-cluster
status:
  phase: Provisioned
  (conditions[?type == 'Ready'] | [0].status): "True"
  (conditions[?type == 'Available'] | [0].status): "True"
  (conditions[?type == 'Restoring'] | [0].status): "False"
---
apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: src-restore
status:
  state: Succeeded
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGRestore
metadata:
  name: src-restore
status:
  state: Succeeded
