# BackupStorage + credentials Secret for the backup test.
# Points at the in-cluster MinIO deployed from minio.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
type: Opaque
data:
  # minioadmin / minioadmin
  AWS_ACCESS_KEY_ID: bWluaW9hZG1pbg==
  AWS_SECRET_ACCESS_KEY: bWluaW9hZG1pbg==
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: minio-s3
spec:
  type: s3
  s3:
    bucket: bucket-1
    region: us-east-1
    endpointURL: https://minio.minio.svc.cluster.local:443
    forcePathStyle: true
    verifyTLS: false
    credentialsSecretRef:
      name: minio-credentials
