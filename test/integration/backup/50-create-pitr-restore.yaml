# Create a point-in-time restore that replays the archived WAL stream on the
# PITR-enabled storage up to the latest available point.
apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: test-restore-to-latest
spec:
  instanceRef:
    name: test-backup-instance
  dataSource:
    type: PointInTime
    pointInTime:
      source:
        storageRef:
          name: minio-s3
      recoveryTarget: latest



