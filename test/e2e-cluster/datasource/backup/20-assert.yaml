apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: seaweedfs-storage
status:
  (conditions[?type == 'Accepted'].status | [0]): "True"
  (backupClasses[?name == 'pg'].compatibility | [0]): Compatible
---
# The class the chart installs, once the provider has accepted it and
# core has judged it compatible with the provider.
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: pg
spec:
  displayName: Percona Backup for PostgreSQL
  executionMode: ProviderManaged
  backupStorageClasses:
    - name: s3
      authModes:
        - AccessKey
  providerManaged:
    providerRef:
      name: provider-percona-postgresql
    supportsPITR: true
status:
  (conditions[?type == 'Accepted'].status | [0]): "True"
  (providers[?name == 'provider-percona-postgresql'].compatibility | [0]): Compatible
