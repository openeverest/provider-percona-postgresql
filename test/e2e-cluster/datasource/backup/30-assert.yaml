apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: pg-src
spec:
  providerRef:
    name: provider-percona-postgresql
  backup:
    enabled: true
    classRef:
      name: percona-backup-postgresql
    storages:
      - storageRef:
          name: minio-storage
        schedules:
          - name: full
            enabled: true
            cron: "0 2 * * *"
  topology:
    type: cluster
  components:
    engine:
      type: postgresql
      replicas: 1
      storage:
        size: 1Gi
      resources:
        limits:
          cpu: 600m
          memory: 512Mi
        requests:
          cpu: 300m
          memory: 256Mi
    proxy:
      type: pgbouncer
      replicas: 1
      resources:
        limits:
          cpu: 200m
          memory: 128Mi
        #defaults to limits
        requests:
          cpu: 200m
          memory: 128Mi
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: pg-src
spec:
  backups:
    enabled: true
    pgbackrest:
      configuration:
        - secret:
            name: pg-src-pgbackrest-repo1-creds
      global:
        repo1-s3-uri-style: path
        repo1-storage-verify-tls: "n"
      repos:
        - name: repo1
          s3:
            bucket: everest-operator
            endpoint: https://minio.minio.svc
            region: us-east-1
          schedules:
            full: 0 2 * * *
  instances:
    - dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
      name: instance1
      replicas: 1
      resources:
        limits:
          cpu: 600m
          memory: 512Mi
        requests:
          cpu: 300m
          memory: 256Mi
  proxy:
    pgBouncer:
      replicas: 1
      resources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 200m
          memory: 128Mi
