apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: bWluaW9hZG1pbg==     # minioadmin
  AWS_SECRET_ACCESS_KEY: bWluaW9hZG1pbg== # minioadmin
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: minio-storage
spec:
  type: s3
  s3:
    bucket: everest-operator
    region: us-east-1
    endpointURL: https://minio.minio.svc
    forcePathStyle: true
    credentialsSecretRef:
      name: minio-credentials
    verifyTLS: false
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: percona-backup-postgresql
spec:
  displayName: Percona Backup for PostgreSQL
  executionMode: ProviderManaged
  supportedProviders:
    - provider-percona-postgresql
  providerManaged:
    supportsPITR: true
    limits:
      maxPITREnabledStorages: 1
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringConfig
metadata:
  name: mc-pmm
spec:
  type: pmm
  pmm:
    # The credentials Secret is created dynamically in the deploy-pmm step,
    # since the PMM service-account token is generated at runtime.
    credentialsSecretRef:
      name: mc-pmm-secret
    verifyTLS: false
    url: https://pmm-server.pmm.svc
