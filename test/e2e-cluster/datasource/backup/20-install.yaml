apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: c2Vhd2VlZGZzYWRtaW4=     # seaweedfsadmin
  AWS_SECRET_ACCESS_KEY: c2Vhd2VlZGZzYWRtaW4= # seaweedfsadmin
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: seaweedfs-storage
spec:
  type: s3
  s3:
    bucket: everest-operator
    region: us-east-1
    endpointURL: https://seaweedfs.seaweedfs.svc
    forcePathStyle: true
    credentialsSecretRef:
      name: seaweedfs-credentials
    verifyTLS: false
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: percona-backup-postgresql
spec:
  displayName: Percona Backup for PostgreSQL
  executionMode: ProviderManaged
  supportedProviders:
    - provider-percona-postgresql
  providerManaged:
    supportsPITR: true
    limits:
      maxPITREnabledStorages: 1
---
# The pmm class as the monitoring-pmm chart ships it, under a test-local name.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: pmm-e2e
spec:
  controllerName: openeverest.io/monitoring-pmm
  providerManaged:
    integration: pmm
    agentImage: percona/pmm-client:3.8.0
    agentVersion: 3.8.0
  destinationParametersSchema:
    openAPIV3Schema:
      type: object
      required: [url]
      properties:
        url:
          type: string
          pattern: '^https?://.+'
        verifyTLS:
          type: boolean
  instanceParametersSchema:
    openAPIV3Schema:
      type: object
      properties:
        resources:
          type: object
          properties:
            limits:
              type: object
              additionalProperties:
                type: string
            requests:
              type: object
              additionalProperties:
                type: string
  credentialsSchema:
    required: [apiKey]
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringDestination
metadata:
  name: pmm
spec:
  classRef:
    name: pmm-e2e
  # The credentials Secret is created dynamically in the deploy-pmm step,
  # since the PMM service-account token is generated at runtime.
  credentialsSecretRef:
    name: pmm-credentials
  parameters:
    url: https://pmm-server.pmm.svc
    verifyTLS: false
