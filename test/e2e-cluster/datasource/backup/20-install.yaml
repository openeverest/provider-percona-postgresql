apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: c2Vhd2VlZGZzYWRtaW4=     # seaweedfsadmin
  AWS_SECRET_ACCESS_KEY: c2Vhd2VlZGZzYWRtaW4= # seaweedfsadmin
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: seaweedfs-storage
spec:
  type: s3
  s3:
    bucket: everest-operator
    region: us-east-1
    endpointURL: https://seaweedfs.seaweedfs.svc
    forcePathStyle: true
    credentialsSecretRef:
      name: seaweedfs-credentials
    verifyTLS: false
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: percona-backup-postgresql
spec:
  displayName: Percona Backup for PostgreSQL
  executionMode: ProviderManaged
  supportedProviders:
    - provider-percona-postgresql
  providerManaged:
    supportsPITR: true
    limits:
      maxPITREnabledStorages: 1
---
# The monitoring-pmm chart's pmm class, rendered with its default values and
# without its display fields and UI hints, under a test-local name.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: pmm-e2e
spec:
  controllerName: openeverest.io/monitoring-pmm
  providerManaged:
    integration: pmm
    agentImage: "percona/pmm-client:3.8.0"
    agentVersion: "3.8.0"
    features: [queryAnalytics]
  destinationParametersSchema:
    openAPIV3Schema:
      type: object
      required: [url]
      properties:
        url:
          type: string
          pattern: '^https?://.+'
          description: PMM Server URL, for example https://pmm.example.com.
        verifyTLS:
          type: boolean
          description: Verify the PMM Server TLS certificate. Applies to this controller's readiness probe; the agents' TLS behaviour is the operator's. Defaults to true.
  instanceParametersSchema:
    openAPIV3Schema:
      type: object
      properties:
        resources:
          type: object
          description: Resource requirements of the pmm-client container.
          additionalProperties: false
          properties:
            limits:
              type: object
              additionalProperties:
                anyOf:
                  - type: integer
                  - type: string
                pattern: '^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$'
                x-kubernetes-int-or-string: true
            requests:
              type: object
              additionalProperties:
                anyOf:
                  - type: integer
                  - type: string
                pattern: '^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$'
                x-kubernetes-int-or-string: true
  credentialsSchema:
    required: [apiKey]
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringDestination
metadata:
  name: pmm
spec:
  classRef:
    name: pmm-e2e
  # The credentials Secret is created dynamically in the deploy-pmm step,
  # since the PMM service-account token is generated at runtime.
  credentialsSecretRef:
    name: pmm-credentials
  parameters:
    url: https://pmm-server.pmm.svc
    verifyTLS: false
