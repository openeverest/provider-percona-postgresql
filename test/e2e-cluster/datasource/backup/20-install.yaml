apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: c2Vhd2VlZGZzYWRtaW4=     # seaweedfsadmin
  AWS_SECRET_ACCESS_KEY: c2Vhd2VlZGZzYWRtaW4= # seaweedfsadmin
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: seaweedfs-storage
spec:
  backupStorageClassRef:
    name: s3
  location:
    bucket: everest-operator
  parameters:
    region: us-east-1
    endpointURL: https://seaweedfs.seaweedfs.svc
    forcePathStyle: true
    implementation: other
  authentication:
    mode: AccessKey
    credentialsSecretRef:
      name: seaweedfs-credentials
  tls:
    insecureSkipVerify: true
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: percona-backup-postgresql
spec:
  displayName: Percona Backup for PostgreSQL
  executionMode: ProviderManaged
  backupStorageClasses:
    - name: s3
      authModes:
        - AccessKey
  supportedProviders:
    - provider-percona-postgresql
  providerManaged:
    supportsPITR: true
    limits:
      maxPITREnabledStorages: 1
---
# The monitoring-pmm chart's pmm class, rendered with its default values and
# without its display fields and UI hints, under a test-local name.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: pmm-e2e
spec:
  providerManaged:
    integration: pmm
    agentImage: "percona/pmm-client:3.8.0"
    agentVersion: "3.8.0"
  destinationParametersSchema:
    openAPIV3Schema:
      type: object
      required: [url]
      properties:
        url:
          type: string
          pattern: '^https?://[^/?#@]+([/?#].*)?$'
          description: PMM Server URL, for example https://pmm.example.com, without user information.
  authModes:
    - name: ServiceAccountToken
      credentials:
        required: [token]
  instanceParametersSchema:
    openAPIV3Schema:
      type: object
      properties:
        resources:
          type: object
          description: Resource requirements of the pmm-client container.
          additionalProperties: false
          properties:
            limits:
              type: object
              additionalProperties:
                anyOf:
                  - type: integer
                  - type: string
                pattern: '^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$'
                x-kubernetes-int-or-string: true
            requests:
              type: object
              additionalProperties:
                anyOf:
                  - type: integer
                  - type: string
                pattern: '^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$'
                x-kubernetes-int-or-string: true
---
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringDestination
metadata:
  name: pmm
spec:
  classRef:
    name: pmm-e2e
  # The credentials Secret is created dynamically in the deploy-pmm step,
  # since the PMM service-account token is generated at runtime.
  authentication:
    mode: ServiceAccountToken
    credentialsSecretRef:
      name: pmm-credentials
  parameters:
    url: https://pmm-server.pmm.svc
  tls:
    insecureSkipVerify: true
