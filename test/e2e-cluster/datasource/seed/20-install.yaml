apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-credentials
type: Opaque
data:
  AWS_ACCESS_KEY_ID: c2Vhd2VlZGZzYWRtaW4=     # seaweedfsadmin
  AWS_SECRET_ACCESS_KEY: c2Vhd2VlZGZzYWRtaW4= # seaweedfsadmin
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: seaweedfs-storage
spec:
  backupStorageClassRef:
    name: s3
  location:
    bucket: everest-operator
  parameters:
    region: us-east-1
    endpointURL: https://seaweedfs.seaweedfs.svc
    forcePathStyle: true
    implementation: other
  authentication:
    mode: AccessKey
    credentialsSecretRef:
      name: seaweedfs-credentials
  tls:
    insecureSkipVerify: true
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: percona-backup-postgresql
spec:
  displayName: Percona Backup for PostgreSQL
  executionMode: ProviderManaged
  backupStorageClasses:
    - name: s3
      authModes:
        - AccessKey
  supportedProviders:
    - provider-percona-postgresql
  providerManaged:
    supportsPITR: true
    limits:
      maxPITREnabledStorages: 1
