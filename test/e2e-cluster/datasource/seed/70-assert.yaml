apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: pg-clone-backup
spec:
  providerRef:
    name: provider-percona-postgresql
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: pg-src-backup
---
apiVersion: backup.openeverest.io/v1alpha1
kind: Restore
metadata:
  name: pg-clone-backup-datasource
spec:
  instanceRef:
    name: pg-clone-backup
  dataSource:
    type: Backup
    backup:
      backupRef:
        name: pg-src-backup
