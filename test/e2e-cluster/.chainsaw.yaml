---
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: e2e-cluster
spec:
  timeouts:
    apply: 60s
    assert: 60s
    # GKE namespace deletion has to detach/delete the underlying GCE Persistent
    # Disks backing the PerconaPGCluster PVCs, which routinely takes longer
    # than the previous 60s default.
    delete: 300s
    error: 60s
    exec: 60s
    cleanup: 300s
  cleanup:
    skipDelete: false
  report:
    format: XML
    name: chainsaw-report
    path: /tmp
